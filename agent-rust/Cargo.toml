[package]
name = "agent-rust"
version = "0.1.0"
edition = "2021"

[features]
dhat-heap = ["dep:dhat"]
tokio-console = [
    "dep:console-subscriber",
    "dep:tracing",
    "dep:tracing-subscriber",
    "tokio/tracing",
]

[dependencies]
anyhow = "1"
chardetng = "1"
clap = { version = "4", features = ["derive"] }
console-subscriber = { version = "0.5", default-features = false, optional = true }
content_inspector = "0.2"
crossterm = "0.28"
dhat = { version = "0.3", optional = true }
encoding_rs = "0.8"
globset = "0.4"
infer = "0.19"
libc = "0.2"
nucleo-matcher = "0.3"
ratatui = { version = "0.29", features = ["unstable-rendered-line-info", "unstable-widget-ref"] }
rust-latex-parser = "0.1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1", features = ["io-std", "io-util", "macros", "process", "rt-multi-thread", "sync"] }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry"], optional = true }
zbus = "5.18"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
