[package]
name = "agent-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
chardetng = "1"
clap = { version = "4", features = ["derive"] }
content_inspector = "0.2"
crossterm = "0.28"
encoding_rs = "0.8"
ignore = "0.4"
infer = "0.19"
libc = "0.2"
nucleo-matcher = "0.3"
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
