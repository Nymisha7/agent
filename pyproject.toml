[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nym-agent"
version = "0.1.0"
description = "CLI-based Nym agent"
requires-python = ">=3.10"
dependencies = ["openai>=1.109.1"]

[project.scripts]
nym = "nym_agent.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["nym_agent*"]
