[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent"
version = "0.1.0"
description = "CLI-based Agent"
requires-python = ">=3.10"
dependencies = ["openai>=2.53.0", "cryptography>=41", "websockets>=12"]

[project.scripts]
agent = "agent.main:main"
nym = "agent.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*"]

[tool.setuptools.package-data]
agent = ["prompts/*.txt", "skills/*/SKILL.md", "bin/*"]
